<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture with set width</title>

    <style>
        
        * {
            box-sizing: border-box;
        }
        
        .containerprova {
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
            border: 4px solid;
        }

        .containerprova img {
            width: 100%;
        }

    </style>

</head>

<body>

    <div class="containerprova">
        <h1>Picture with set width of our one and only.</h1>
        <p>And now let's see how it behaves</p>

        <img src="images/image.jpg" alt="winstony, with max width">

        <h1>A newer picture with  a set width, more classic.</h1>
        <p>And now let's see how it behaves</p>

        <img src="images/image2.jpg" alt="microscopic silly cat in set width">

    </div>
</body>

</html>
